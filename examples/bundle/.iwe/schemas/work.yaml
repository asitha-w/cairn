$schema: https://document-schema.org/draft/2026-06/schema
description: Cairn work node — one piece of work (an issue, a task, a thread). Hand-written fields are state, Now, Next, Decisions, Context; producers own gh_* and Log.
frontmatter:
  type: object
  required: [type, title, state, stage]
  properties:
    type: { const: work }
    title: { type: string, minLength: 3 }
    state: { type: string, minLength: 3, maxLength: 200, description: "one sentence: what is true right now" }
    stage: { enum: [active, parked, blocked, done], description: "where the work is; OKF status (draft/stable/deprecated) is separate and optional" }
    resource: { type: string, description: "URL of the system of record for this work, usually the issue" }
    env: { type: array, items: { type: string } }
    systems: { type: array, items: { type: string }, description: "slugs of system nodes (systems/<slug>)" }
    people: { type: array, items: { type: string }, description: "slugs of person nodes (people/<slug>)" }
    blocked_by: { type: array, items: { type: string }, description: "keys of work nodes" }
    gh_state: { enum: [open, closed, merged] }
    gh_updated: { type: string }
    last_actor: { type: string }
    priority: { type: integer, minimum: 1, maximum: 9, description: "1 is highest; the legend for each level is in cairn.toml [priority].levels" }
    priority_by: { enum: [human, sweep], description: "sweep proposes from words; a human value is never overwritten" }
    updated: { type: string, format: date }
    generated:
      type: object
      properties: { by: { type: string }, at: { type: string } }
    tags: { type: array, items: { type: string } }
maxDepth: 3
sections:
  - header: { minLength: 3 }
    maxContains: 1
    sections:
      - header: { const: Now }
        maxContains: 1
        description: one dated paragraph, what is true; the resume point
      - header: { const: Next }
        maxContains: 1
        description: numbered steps
      - header: { const: Decisions }
        maxContains: 1
        description: "- YYYY-MM-DD one line per decision"
      - header: { const: Context }
        maxContains: 1
        description: "- finding in one sentence → path or URL of a file outside the bundle; read only on doubt"
      - header: { const: Log }
        maxContains: 1
        description: "- YYYY-MM-DD one line; appended by crn log and crn trail"
    additionalSections: false
additionalSections: false
