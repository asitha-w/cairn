# cairn.toml — lives at the bundle root; everything specific to you is here, nothing in the tool.

[github]
org = "acme"           # crn sweep searches: org:<org> is:open assignee:<user>
user = "me"

[trail]
transcripts = "~/.claude/projects"   # where Claude Code writes session transcripts
prefix = "-home-me-work"             # encoded project dir prefix; only transcripts under it are folded into ## Log

[tidy]
# Thresholds for `crn tidy`. All optional; these are the defaults.
max_tokens = 1000          # a node past this is a candidate to split or to roll its Log into a file
max_log = 15               # Log lines before rolling the older ones out
quiet_active_days = 30     # active but not updated this long
parked_days = 90           # parked this long: still worth keeping?
untriaged_days = 14        # a sweep stub without a state sentence
placeholders = []          # Context sentences that are not findings yet, e.g. ["pre-Cairn task note"]

[priority]
# Your legend, 1 is highest. Rename, add or remove levels; the product only knows the count.
levels = ["Outage or special ask", "Security", "Cost", "Everything else"]

[priority.match]
# Words (regex alternatives) that let `crn sweep` propose a level from an issue's title and labels. Optional.
"1" = ["outage", "incident", "\\bprod\\b", "production", "is down", "data loss"]
"2" = ["security", "\\bcve\\b", "secret", "credential", "token", "firewall"]
"3" = ["cost", "reservation", "budget", "spend", "billing"]
