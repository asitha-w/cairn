<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cairn graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#8b93a7; --panel:#171a21; --line:#2a2f3a; --accent:#7aa2f7;
          --p1:#f7768e; --p2:#ff9e64; --p3:#e0af68; --p4:#9ece6a; --none:#565f89; --sys:#7dcfff; --person:#bb9af7;
          --review:#73daca; --mine:#c0caf5; --record:#e0af68; --active:#9ece6a; --blocked:#f7768e; --parked:#e0af68; --done:#565f89; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  #wrap { display:flex; height:100%; }
  #cw { flex:1; min-width:0; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #side { width:300px; border-left:1px solid var(--line); background:var(--panel); padding:12px 14px; overflow:auto; display:flex; flex-direction:column; gap:14px; }
  #side h1 { margin:0; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; }
  #side h1 small { color:var(--muted); font-weight:normal; font-size:12px; }
  fieldset { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:0; display:flex; flex-direction:column; gap:6px; }
  legend { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:0 4px; }
  label { color:var(--muted); display:flex; gap:6px; align-items:center; justify-content:space-between; }
  label.chk { justify-content:flex-start; }
  select, input[type=search] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font:inherit; }
  select { min-width:150px; }
  input[type=search] { width:100%; box-sizing:border-box; }
  #legend { display:flex; flex-direction:column; gap:4px; color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .line { display:inline-block; width:14px; height:2px; margin-right:6px; vertical-align:middle; }
  .hint { color:var(--muted); font-size:12px; }
  code { background:var(--bg); padding:1px 4px; border-radius:3px; }
  #card { position:absolute; left:14px; bottom:14px; max-width:460px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; box-shadow:0 8px 30px rgba(0,0,0,.5); display:none; }
  #card.on { display:block; }
  #card h2 { margin:0 0 4px; font-size:14px; padding-right:24px; }
  #card .k { color:var(--muted); font-size:12px; }
  #card .state { margin:8px 0; padding:8px; border-left:3px solid var(--accent); background:var(--bg); }
  #card ul { padding-left:18px; margin:4px 0; max-height:120px; overflow:auto; }
  #card a { color:var(--accent); }
  #card .x { position:absolute; right:10px; top:8px; cursor:pointer; color:var(--muted); }
  #card .btns { display:flex; gap:8px; margin-top:8px; }
  button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #stats { color:var(--muted); font-size:12px; }
  #list { position:absolute; inset:0; overflow:auto; padding:14px 18px; display:none; background:var(--bg); }
  #list.on { display:block; }
  #list table { border-collapse:collapse; width:100%; font-size:12.5px; }
  #list th { text-align:left; color:var(--muted); font-weight:normal; border-bottom:1px solid var(--line); padding:6px 8px; position:sticky; top:0; background:var(--bg); }
  #list td { padding:6px 8px; border-bottom:1px solid #1d2028; vertical-align:top; }
  #list tr:hover td { background:var(--panel); cursor:pointer; }
  #list .why { color:var(--muted); }
  #list .p { font-weight:600; }
  #list .sq { display:inline-block; width:9px; height:9px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<div id="wrap">
  <div id="cw">
    <canvas id="c"></canvas>
    <div id="list"></div>
    <div id="card"></div>
  </div>
  <div id="side">
    <h1>Cairn <small id="stats"></small></h1>
    <fieldset><legend>view</legend>
      <label>mode <select id="mode"><option value="graph">graph</option><option value="list">list</option><option value="start">what to start now</option></select></label>
      <label>group by <select id="group"><option value="none">nothing</option><option value="repo">repo</option><option value="system">system</option><option value="stage">stage</option><option value="priority">priority</option></select></label>
      <label>colour by <select id="colour"><option value="priority">priority</option><option value="stage">stage</option><option value="repo">repo</option><option value="type">type</option></select></label>
      <label>size by <select id="size"><option value="logs">activity</option><option value="links">links</option><option value="none">same</option></select></label>
      <input type="search" id="q" placeholder="find… title, state, key">
    </fieldset>
    <fieldset><legend>show</legend>
      <div id="stages"></div>
      <label class="chk"><input type="checkbox" id="showsys" checked> systems</label>
      <label class="chk"><input type="checkbox" id="showpeople" checked> people</label>
      <label class="chk"><input type="checkbox" id="showrecords"> records everywhere <span class="hint" id="reccount"></span></label>
      <label class="chk"><input type="checkbox" id="showprs" checked> pull requests <span class="hint" id="prcount"></span></label>
      <label class="chk"><input type="checkbox" id="focus" checked> focus on selection</label>
    </fieldset>
    <fieldset><legend>legend</legend><div id="legend"></div></fieldset>
    <div class="hint">Click a node for its card and to focus on its neighbours; records (investigations, research, runbooks) appear there. Click empty space to clear. Drag to move, wheel to zoom, double-click to re-fit.</div>
    <div class="hint" id="stamp"></div>
  </div>
</div>
<script>

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), cw = $('cw'), card = $('card');

const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
G.nodes.forEach(n => { n.x = (Math.random() - .5) * 600; n.y = (Math.random() - .5) * 600; n.vx = 0; n.vy = 0; n.links = 0; });
G.edges.forEach(e => { byId[e.s].links++; byId[e.t].links++; });
const nb = {}; G.edges.forEach(e => { (nb[e.s] = nb[e.s] || new Set()).add(e.t); (nb[e.t] = nb[e.t] || new Set()).add(e.s); });

function visible(n) {

  if (n.type === 'person' && !$('showpeople').checked) return false;
  if (n.type === 'pr' && !$('showprs').checked) return false;
  if (n.type === 'record' && !$('showrecords').checked && !(selected && $('focus').checked && (nb[selected.id] || new Set()).has(n.id)) && n !== selected) return false;

  if (q && !(n.title + ' ' + (n.state || '') + ' ' + n.id).toLowerCase().includes(q)) return false;

}
function groupKey(n) {

  if (g === 'repo') return n.repo || (n.type === 'system' ? 'systems' : n.type === 'person' ? 'people' : n.type === 'record' ? 'records' : 'other');
  if (g === 'system') return n.type === 'system' ? n.id : (n.systems && n.systems[0] ? 'systems/' + n.systems[0] : n.type === 'work' ? 'no system' : n.type);

}
const hub = g => ['systems', 'people', 'records', 'system', 'person', 'record', 'pr', 'other'].includes(g);
const colourCache = {};
function colour(n) {

  if (n.type === 'system') return css('--sys'); if (n.type === 'person') return css('--person');
  if (n.type === 'pr') return n.role === 'review' ? css('--review') : css('--mine');
  if (n.type === 'record') return css('--record');
  if (c === 'priority') return n.priority ? css('--p' + Math.min(n.priority, 4)) : css('--none');
  if (c === 'stage') return css('--' + (n.stage || 'none'));
  if (c === 'type') return css('--accent');

}
function radius(n) {
  const s = $('size').value; const base = n.type === 'work' ? 6 : n.type === 'pr' ? 4 : n.type === 'record' ? 4 : 5;
  if (s === 'logs') return base + Math.min(n.logs || 0, 20) * 0.6; if (s === 'links') return base + Math.min(n.links, 20) * 0.7; return base;
}
function legend() {
  const c = $('colour').value, el = $('legend'); el.innerHTML = '';
  const item = (col, txt) => el.insertAdjacentHTML('beforeend', `<span><i class="dot" style="background:${col}"></i>${txt}</span>`);
  if (c === 'priority') { Object.entries(G.legend || {}).forEach(([k, v]) => item(css('--p' + Math.min(k, 4)), 'P' + k + ' ' + v)); item(css('--none'), 'no priority'); }
  else if (c === 'stage') ['active', 'blocked', 'parked', 'done'].forEach(s => item(css('--' + s), s));
  else if (c === 'repo') Object.entries(colourCache).forEach(([k, v]) => item(v, k));
  else item(css('--accent'), 'work');
  item(css('--sys'), 'system'); item(css('--person'), 'person'); if (recs.length) item(css('--record'), 'record (investigation, research, runbook)');
  if (prs.length) { item(css('--review'), 'PR requesting your review'); item(css('--mine'), 'your open PR'); }
  el.insertAdjacentHTML('beforeend', `<span><i class="line" style="background:${css('--blocked')}"></i>blocked by</span><span><i class="line" style="background:${css('--person')}"></i>waits on</span><span><i class="line" style="background:rgba(139,147,167,0.6)"></i>about / links</span>`);
}
const centers = {};
function step() {

  const counts = {}; vis.forEach(n => { const g = groupKey(n); if (g !== null && !hub(g)) counts[g] = (counts[g] || 0) + 1; });
  // a group earns a hull only with two or more members; singletons and hubs float in the middle

  for (const k in centers) if (!groups.includes(k)) delete centers[k];

  groups.forEach((g, i) => { const a = (i / groups.length) * Math.PI * 2 - Math.PI / 2; centers[g] = { x: Math.cos(a) * R, y: Math.sin(a) * R }; });
  for (const n of vis) {

    const c = grouped ? centers[g] : { x: 0, y: 0 }; const k = gk === 'none' ? 0.002 : grouped ? 0.05 : 0.006;

    const min = radius(a) + radius(b) + 14; const f = d < min ? (min - d) * 0.2 : 2600 / d2;

    const a = byId[e.s], b = byId[e.t]; if (!visible(a) || !visible(b)) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, want = (selected && $('focus').checked) ? 170 : 120, f = (d - want) * 0.015;

}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.translate(W / 2 + tx, H / 2 + ty); ctx.scale(scale, scale);
  const vis = G.nodes.filter(visible), gk = $('group').value;
  if (gk !== 'none') for (const [g, c] of Object.entries(centers)) {
    const mem = vis.filter(n => groupKey(n) === g); if (!mem.length) continue;
    const cx = mem.reduce((s, n) => s + n.x, 0) / mem.length, cy = mem.reduce((s, n) => s + n.y, 0) / mem.length;
    const rr = Math.max(40, ...mem.map(n => Math.hypot(n.x - cx, n.y - cy) + radius(n) + 18));
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fillStyle = 'rgba(122,162,247,0.035)'; ctx.fill(); ctx.strokeStyle = 'rgba(122,162,247,0.2)'; ctx.lineWidth = 1 / scale; ctx.stroke();
    const many = Object.keys(centers).length > 8;
    ctx.font = `bold ${(many ? 12 : 18) / scale}px system-ui`; ctx.fillStyle = css('--fg'); ctx.textAlign = 'center'; ctx.fillText(`${g.replace(/^systems\//, '')} · ${mem.length}`, cx, cy - rr - 8 / scale); ctx.textAlign = 'left';
  }
  for (const e of G.edges) { const a = byId[e.s], b = byId[e.t]; if (!visible(a) || !visible(b)) continue;
    const hot = selected && (a === selected || b === selected);
    const dim = G.edges.length > 250 ? 0.14 : 0.3;
    ctx.strokeStyle = hot ? css('--accent') : e.rel === 'blocked_by' ? css('--blocked') : e.rel === 'waits_on' ? css('--person') : `rgba(139,147,167,${dim})`; ctx.lineWidth = (hot ? 2 : 1) / scale;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  const q = $('q').value.trim(), focused = selected && $('focus').checked;
  for (const n of vis) { const r = radius(n); ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fillStyle = colour(n); ctx.fill();

      ctx.fillStyle = n.type === 'work' || n.type === 'pr' || bold ? css('--fg') : css('--muted');
      ctx.font = `${bold ? 'bold ' : ''}${((n.type === 'work' ? 11 : 10) + (n === selected ? 2 : 0)) / scale}px system-ui`;
      const maxLen = bold ? 48 : 34;
      ctx.fillText(n.title.length > maxLen ? n.title.slice(0, maxLen - 1) + '…' : n.title, n.x + r + 3, n.y + 4 / scale);
      if (isNb) {   // one line of context under a neighbour: how it relates, and what it says about itself
        const rel = relations(selected)[n.id]; const relTxt = rel ? [...rel].join(', ') : '';
        const ctxTxt = n.type === 'work' ? (n.state || '') : n.type === 'system' ? (n.state || '') : n.type === 'record' ? ((n.kind || 'record') + ' ' + (n.date || '') + ' · ' + (n.state || '')) : n.type === 'pr' ? (n.role === 'review' ? 'requests your review' : 'your open PR') + ' · ' + n.updated : '';
        const line2 = [relTxt, n.type === 'work' && n.stage ? n.stage + (n.priority ? ' P' + n.priority : '') : '', ctxTxt].filter(Boolean).join(' · ');

        ctx.fillText(line2.length > 90 ? line2.slice(0, 89) + '…' : line2, n.x + r + 3, n.y + 16 / scale);

    } }
  $('stats').textContent = `${vis.filter(n => n.type === 'work').length} work · ${vis.filter(n => n.type === 'system').length} systems · ${vis.filter(n => n.type === 'record').length} records · ${vis.filter(n => n.type === 'pr').length} PRs`;
}
function fit() { const vis = G.nodes.filter(visible); if (!vis.length) return;
  const xs = vis.map(n => n.x), ys = vis.map(n => n.y), minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const pad = $('group').value === 'none' ? 90 : 190, ch = card.classList.contains('on') ? card.offsetHeight + 20 : 0;
  const sw = (W - pad) / Math.max(maxx - minx, 1), sh = (H - pad - ch) / Math.max(maxy - miny, 1); scale = Math.max(0.2, Math.min(2.5, Math.min(sw, sh)));

function loop() { step(); if (!touched && ++ticks % 20 === 0 && ticks < 400) fit(); draw(); requestAnimationFrame(loop); }

function pick(mx, my) { const x = (mx - W / 2 - tx) / scale, y = (my - H / 2 - ty) / scale; let best = null, bd = 1e9;
  for (const n of G.nodes.filter(visible)) { const d = Math.hypot(n.x - x, n.y - y); if (d < radius(n) + 4 && d < bd) { best = n; bd = d; } } return best; }

// ---- ranking for "what to start now": transparent rules, every point has a reason
function rank(n) {

  if (n.type === 'pr' && n.role === 'review') { s += 100; why.push('review requested from you'); }
  if (n.type === 'pr' && n.role === 'mine') { s += 12; why.push('your open PR'); }
  if (n.priority) { s += [0, 40, 30, 20, 0][Math.min(n.priority, 4)]; why.push('P' + n.priority + (n.priority_label ? ' ' + n.priority_label : '')); }

}
function renderList(mode) {
  const el = $('list'); const rows = G.nodes.filter(n => (n.type === 'work' || n.type === 'pr') && visibleBase(n));
  const scored = rows.map(n => ({ n, ...rank(n) }));
  if (mode === 'start') scored.sort((a, b) => b.s - a.s || (a.n.updated < b.n.updated ? 1 : -1));
  else scored.sort((a, b) => ((a.n.priority || 9) - (b.n.priority || 9)) || (a.n.updated < b.n.updated ? 1 : -1));
  const esc2 = esc;
  el.innerHTML = `<table><thead><tr><th>P</th><th>stage</th><th>updated</th><th>title</th><th>state</th>${mode === 'start' ? '<th>why now</th>' : ''}</tr></thead><tbody>` +
    scored.map(({ n, why }) => `<tr data-id="${esc2(n.id)}"><td class="p" style="color:${colour(n)}">${n.type === 'pr' ? '<i class="sq" style="background:' + colour(n) + '"></i>PR' : n.priority ? 'P' + n.priority : '—'}</td><td>${esc2(n.type === 'pr' ? (n.role === 'review' ? 'review' : 'mine') : n.stage)}</td><td>${esc2(n.updated)}</td><td>${esc2(n.title)}</td><td class="why">${esc2(n.state || '')}</td>${mode === 'start' ? `<td class="why">${esc2(why.join(' · '))}</td>` : ''}</tr>`).join('') + '</tbody></table>';
  el.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => show(byId[tr.dataset.id]));
}
function visibleBase(n) {   // the show toggles and search, without the focus filter
  if (n.type === 'pr' && !$('showprs').checked) return false;
  if (n.type === 'record' && !$('showrecords').checked && !(selected && $('focus').checked && (nb[selected.id] || new Set()).has(n.id)) && n !== selected) return false;
  if (n.type === 'work') { const c = $('stages').querySelector(`[data-stage="${n.stage}"]`); if (c && !c.checked) return false; }
  const q = $('q').value.trim().toLowerCase();
  return !(q && !(n.title + ' ' + (n.state || '') + ' ' + n.id).toLowerCase().includes(q));
}
function applyMode() { const m = $('mode').value; $('list').classList.toggle('on', m !== 'graph'); if (m !== 'graph') renderList(m); }
function show(n) {
  selected = n; touched = false; ticks = 0;
  if (!n) { card.classList.remove('on'); return; }
  const rel = relations(n);
  const linked = Object.entries(rel).map(([o, rs]) => `<li><a href="#" data-id="${esc(o)}">${esc(byId[o].title)}</a> <span class="k">${esc([...rs].join(', '))}</span></li>`).join('');
  card.innerHTML = `<span class="x" title="close">✕</span><h2>${esc(n.title)}</h2><div class="k"><code>${esc(n.id)}</code>${n.repo ? ' · ' + esc(n.repo) : ''}${n.type === 'pr' ? ' · ' + (n.role === 'review' ? 'requests your review' : 'your open PR') + ' · ' + esc(n.updated) : ''}</div>` +
    (n.type === 'record' ? `<div class="k">${esc(n.kind || 'record')} · ${esc(n.date || '')}</div>` : '') +
    (n.type === 'work' ? `<div class="k">${esc(n.stage)}${n.priority ? ' · P' + n.priority + ' ' + esc(n.priority_label || '') : ''} · updated ${esc(n.updated)}${n.gh_updated ? ' · gh ' + esc(n.gh_updated) : ''} · ${n.logs} sessions</div>` : '') +
    (n.state ? `<div class="state">${esc(n.state)}</div>` : '') + (n.env && n.env.length ? `<div class="k">env ${esc(n.env.join(', '))}</div>` : '') +
    (n.resource ? `<div class="k"><a href="${esc(n.resource)}" target="_blank">${esc(n.resource)}</a></div>` : n.url ? `<div class="k"><a href="${esc(n.url)}" target="_blank">${esc(n.url)}</a></div>` : '') +
    `<div class="k" style="margin-top:8px">linked nodes (${Object.keys(rel).length})</div><ul>${linked}</ul>` +
    `<div class="btns"><button id="copy">copy for Claude</button><button id="unfocus">${$('focus').checked ? 'show all' : 'focus'}</button></div>`;
  card.classList.add('on');
  card.querySelector('.x').onclick = () => show(null);
  card.querySelectorAll('a[data-id]').forEach(a => a.onclick = ev => { ev.preventDefault(); show(byId[a.dataset.id]); });
  $('copy').onclick = () => { navigator.clipboard.writeText(clip(n)).then(() => { $('copy').textContent = 'copied'; setTimeout(() => $('copy').textContent = 'copy for Claude', 1200); }); };
  $('unfocus').onclick = () => { $('focus').checked = !$('focus').checked; show(n); };
}
cv.addEventListener('mousedown', e => { touched = true; const n = pick(e.offsetX, e.offsetY); drag = n ? n : { pan: true, x: e.offsetX, y: e.offsetY, moved: false }; });
cv.addEventListener('mousemove', e => { if (drag && drag.pan) { drag.moved = true; tx += e.offsetX - drag.x; ty += e.offsetY - drag.y; drag.x = e.offsetX; drag.y = e.offsetY; }
  else if (drag) { drag.x = (e.offsetX - W / 2 - tx) / scale; drag.y = (e.offsetY - H / 2 - ty) / scale; drag.vx = drag.vy = 0; } else hover = pick(e.offsetX, e.offsetY); });
cv.addEventListener('mouseup', e => { if (drag && !drag.pan) show(drag); else if (drag && drag.pan && !drag.moved) show(null); drag = null; });
cv.addEventListener('dblclick', e => { if (!pick(e.offsetX, e.offsetY)) { touched = false; ticks = 0; } });
cv.addEventListener('wheel', e => { e.preventDefault(); touched = true; scale = Math.max(0.2, Math.min(4, scale * (e.deltaY < 0 ? 1.1 : 0.9))); }, { passive: false });
document.querySelectorAll('#side select, #side input').forEach(el => el.addEventListener('input', () => { Object.keys(colourCache).forEach(k => delete colourCache[k]); legend(); touched = false; ticks = 0; applyMode(); }));
window.addEventListener('resize', resize); resize(); legend(); loop();
</script>
